[workspace]
resolver = "2"
members = [
    "anchor",
    "tpm-driver",
]

[patch.crates-io]
softcore-rv64 = { git = "https://github.com/CharlyCst/softcore-rs.git", rev = "6ebe7f9d" }

[workspace.lints.clippy]
uninlined_format_args = "allow"
result_unit_err = "allow"

[profile.dev]
panic = "abort"
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
